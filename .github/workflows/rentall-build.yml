name: RentAll .NET build
on:
  push:
    branches:
      - recovery/supabase-render
  pull_request:
    branches:
      - Master
      - recovery/supabase-render

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate Razor page structure
        run: python3 scripts/check_ui.py
      - name: Validate frontend JavaScript
        run: |
          for file in wwwroot/js/rentall-ui.js wwwroot/js/regions.js wwwroot/js/cep.js wwwroot/js/google-maps.js wwwroot/js/photo-carousel.js wwwroot/js/publish-experience.js wwwroot/js/maps-loader.js wwwroot/js/marketplace-enhancements.js wwwroot/js/in-platform-journey.js wwwroot/js/publish-earnings.js wwwroot/js/rental-confidence.js; do
            node --check "$file"
          done
      - name: Restore packages
        run: dotnet restore aluguel.csproj
      - name: Compile application
        run: dotnet build aluguel.csproj --no-restore -c Release
      - name: Verify Docker image
        run: docker build --tag rentall:ci .
