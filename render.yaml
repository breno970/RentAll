services:
  - type: web
    name: rentall
    runtime: docker
    region: frankfurt
    plan: free
    branch: recovery/supabase-render
    autoDeployTrigger: off
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: Supabase__Url
        value: https://uyfaxvsedxljcztwveqy.supabase.co
      - key: Supabase__ServiceKey
        sync: false
      - key: ConnectionStrings__ApplicationDbContextConnection
        sync: false
